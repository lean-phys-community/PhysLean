version: v0.1

Title: Configuration Space

Overview: |
    The configuration space `Q` of a mechanical system is the manifold of its possible
    instantaneous configurations, coordinatised by generalized coordinates. It is the base
    space of the Lagrangian formulation: a Lagrangian is a function on the tangent bundle
    `TQ` (positions and velocities), and the Euler-Lagrange equations describe curves in `Q`.

    There is at present no single general `ConfigurationSpace` construction shared across the
    Lagrangian API; the notion exists only as concrete, per-system types. The most developed
    instance is the geometric harmonic oscillator, whose `ConfigurationSpace` is built up as a
    genuine one-dimensional analytic manifold: a wrapper around a single global coordinate in
    `EuclideanSpace ℝ (Fin 1)`, carrying an induced topology, a coordinate homeomorphism and
    analytic diffeomorphism, charted-space and manifold instances, tangent-coordinate
    infrastructure, and a map to physical `Space 1`. Lighter per-system configuration-space
    types exist for the sliding pendulum (support position and string angle) and, as a
    `sorry` stub only, for the coplanar double pendulum.

ParentAPIs:
  - Space (Physlib/SpaceAndTime/Space)

References:
  - Ivo Terek, Introductory Variational Calculus on Manifolds, Section 1
  - Landau and Lifshitz, Mechanics, 3rd ed., Chapter 1 (generalised co-ordinates, the principle of least action, the Lagrangian)


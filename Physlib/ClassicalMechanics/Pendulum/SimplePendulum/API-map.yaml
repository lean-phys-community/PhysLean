version: v0.1

Title: Simple pendulum

Overview: |
    A simple pendulum is a bob on a rigid massless rod of length ℓ, pinned at a pivot and swinging
    in a vertical plane under gravity g. Its configuration is the angle of the rod from the downward
    vertical, taken modulo a full turn, so the configuration space is a circle; the position of the
    bob in the plane is (ℓ sin θ, −ℓ cos θ). The motion is governed by θ̈ + (g/ℓ) sin θ = 0. For
    small amplitudes it is harmonic with period 2π√(ℓ/g); for librations (amplitudes below the
    inverted position) the period grows with the amplitude and is given by a complete elliptic
    integral. This API records the configuration space with its manifold structure and its
    embedding into physical space, together with the lifted Lagrangian and equation of motion,
    the equivalence of that equation with the vanishing of the variational gradient of the
    action, the conservation of energy, the Hamiltonian formulation with the equivalence of
    the Newtonian, scalar, Hamiltonian and variational formulations, the equilibria with
    the separatrix energy and the below/above-threshold energy bounds, the invariance of
    the lifted dynamics under shifting the angle by whole turns,
    the uniqueness of the solutions with given initial angle and
    angular velocity together with their time-reversal symmetry, and, for any initial data, a
    curve with that initial data satisfying the equation of motion within ε of the initial
    instant, and the small-angle limit —
    the linearized dynamics as a harmonic oscillator, its period 2π√(ℓ/g), and the cubic bound
    on the linearization error — and the classical amplitude-dependent period formula
    4√(ℓ/g) K(sin²(θ₀/2)), with its small-angle limit and its monotonicity and bounds in the
    amplitude; its identification with the nonlinear return time remains open.

ParentAPIs:
  - "Space (Physlib/SpaceAndTime/Space)"
  - "Configuration space for pendulum (Physlib/ClassicalMechanics/Pendulum)"

References:
  - Landau & Lifshitz, Mechanics, 3rd Edition, Chapter 1 (The Equations of motion), Section 5 (The Lagrangian for a system of particles).
  - Landau & Lifshitz, Mechanics, 3rd Edition, Chapter 3 (Integration of the equations of motion), Section 11 (Motion in one dimension), Problem 1 (the period of the pendulum as a complete elliptic integral).
  - Landau & Lifshitz, Mechanics, 3rd Edition, Chapter 5 (Small oscillations), Section 21 (Free oscillations in one dimension).
  - Landau & Lifshitz, Mechanics, 3rd Edition, Chapter 7 (The canonical equations), Section 40 (Hamilton's equations).


version: v0.1

Title: Configuration space for pendulum

Overview: |
    The pendulum is a simple example of a classical-mechanical system whose key data
    structure is its configuration space. This API covers the pendulum problems from
    Landau & Lifshitz, Mechanics, Chapter 1, Section 5.

    Current state (partial): the sliding pendulum (`SlidingPendulum.lean`) has a genuine
    configuration space `structure ConfigurationSpace` with generalized coordinates
    `supportPosition : ℝ` (the horizontal position of the support mass) and
    `angle : Real.Angle` (the angle the string makes with the vertical). The coplanar
    double pendulum (`CoplanarDoublePendulum.lean`) declares `ConfigurationSpace` but it
    is still `sorry` (`@[sorryful] def ConfigurationSpace : Type := sorry`), so it is not
    treated as defined here. The miscellaneous pivot-motion file
    (`MiscellaneousPendulumPivotMotions.lean`) contains only documentation and no
    declarations.

    The remaining requirements (a manifold structure on the configuration
    space, a map to `Space` giving the position in real space, a trajectory based on the
    configuration space, and the lagrangian) are not yet implemented in the Pendulum
    directory and are marked undone below.

ParentAPIs:
  - Classical mechanics Lagrangian (Physlib/ClassicalMechanics/Lagrangian)
  - Space (Physlib/SpaceAndTime/Space)

References:
  - Landau & Lifshitz, Mechanics, 3rd Edition, Chapter 1 (The Equations of motion), Section 5 (The Lagrangian for a system of particles).

Requirements:

  - description: >
      The key data structure, the configuration space of the pendulum, is defined
      (chosen here as generalized coordinates, the support position and the string
      angle for the sliding pendulum).
    done: true
    location: Physlib/ClassicalMechanics/Pendulum/SlidingPendulum.lean (ConfigurationSpace)

  - description: The API shall contain the structure of a manifold on the configuration space.
    done: false
    location: "N/A"

  - description: >
      The API shall contain a map from the configuration space to `Space`, giving the
      position of the pendulum in real space.
    done: false
    location: "N/A"

  - description: The API shall contain the definition of a trajectory based on the configuration space.
    done: false
    location: "N/A"

  - description: The API shall subsequently contain the definition of the lagrangian.
    done: false
    location: "N/A"
